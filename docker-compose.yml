services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-analytics-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_root_demo
      MYSQL_DATABASE: ecommerce_analytics
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: local_demo_password
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal_root_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:

